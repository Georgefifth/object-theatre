<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Three everyday objects walk out of their assigned roles. A short interactive comic in English and Chinese."><title>杯子有话说 · 物件剧场</title><link rel="stylesheet" href="./style.css"><script src="./i18n.js" defer></script><script src="./app.js" defer></script></head><body>
<header><a class="wordmark" href="./"><b data-i18n="物件剧场">物件剧场</b><span data-i18n="今晚，桌面不太安分。">今晚，桌面不太安分。</span></a><nav><label class="language-label"><span>语言 / Language</span><select id="language" aria-label="语言 / Language"><option value="zh-CN">中文</option><option value="en">English</option></select></label><button id="settingsToggle" hidden aria-expanded="false" aria-controls="settings" data-i18n="幕后设置">幕后设置</button></nav></header>
<section id="settings" hidden><label>Gemini API Key<input id="key" type="password" autocomplete="off" data-placeholder="只在本次页面会话使用"></label><label><span data-i18n="编剧模型"></span><input id="textModel" value="gemini-2.5-flash"></label><label><span data-i18n="画师模型"></span><input id="imageModel" value="gemini-2.5-flash-image"></label><p data-i18n="使用自己的照片生成时，照片与设定将发送给 Google。Key 与照片不写入本机文件；可能使用你的 API 额度。示例不调用模型。"></p></section>
<main><section class="opening"><div><p class="premise" data-i18n="寻物启事：一块橡皮，在自己的故事里失踪了。"></p><h1 data-i18n="杯子有话说。">杯子有话说。</h1><p class="lede" data-i18n="给你的物件一个角色。然后听听，它愿不愿意演。"></p><button id="quickStart" class="primary" data-i18n="立即试演">立即试演</button><p class="quick-note" data-i18n="不需要账号、照片或 API Key。"></p></div><div class="opening-prop" aria-hidden="true"><div class="cup">☕<span data-i18n="“等等，谁说我是证人？”"></span></div><span class="ticket" data-i18n="三件物品。一场不听话的戏。"></span></div></section>
<p id="deploymentNotice" class="deployment-note" hidden data-i18n="在线试玩仅运行原创示例。自己的照片创作需要本机 Python 服务；这里不会上传照片或索取 Key。"></p>
<details id="castingPanel" class="casting"><summary id="castHeading" data-i18n="给演员换个角色">给演员换个角色</summary><div class="casting-heading"><h2 data-i18n="今晚的演员"></h2><button id="sample" data-i18n="恢复示例演员"></button></div><div id="cast" class="cast-strip"></div><div class="director-bar"><p id="mode"></p><button id="start" class="primary" data-i18n="拉开帷幕"></button></div></details>
<section id="stage" class="stage" hidden aria-labelledby="storyTitle"><div class="stage-top"><div><p id="source" class="source"></p><h2 id="storyTitle" tabindex="-1"></h2></div><div class="stage-actions"><button id="artRetry" hidden></button><button id="export" disabled data-i18n="带走这出戏"></button><button id="print" disabled data-i18n="打印 / 存为 PDF"></button></div></div><div id="comic" class="comic"></div><aside id="protest" class="protest" hidden><span class="protest-mark" data-i18n="等一下！"></span><div><p id="protestActor"></p><blockquote id="protestLine"></blockquote><p id="protestRequest"></p></div><div class="choices"><button id="listen" class="primary" data-i18n="听它说完"></button><button id="insist" data-i18n="导演说了算"></button></div></aside><div id="ending" class="ending" hidden></div><div class="stage-bottom"><button id="otherEnding" hidden data-i18n="看看另一种结局"></button><button id="newShow" data-i18n="重新选角"></button><details><summary data-i18n="这些物件为什么这样演？"></summary><ul id="details"></ul></details></div></section>
<div class="feedback"><p id="status" role="status" aria-live="polite"></p><button id="cancel" hidden data-i18n="停止生成"></button></div></main><footer><span data-i18n="物件没有真的醒来。这是你和它们一起写的虚构故事。"></span><span id="photoNote" data-i18n="照片留在本页，直到你点击真实生成。"></span></footer>
</body></html>
